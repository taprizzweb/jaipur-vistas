<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu | Jaipur Vista Café — Opposite Hawa Mahal, Jaipur</title>
<meta name="description" content="The Jaipur Vista menu — signature pizzas, pasta, pesto mushroom sandwich, Indian & Chinese dishes and chai, served on a rooftop opposite Hawa Mahal.">
<meta name="theme-color" content="#1b4fa0">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="menu">
<header id="site-header"></header>
<main id="main">
<section class="page-hero">
 <div class="wrap">
  <p class="kicker">European · Indian · Chinese</p>
  <h1>Our menu</h1>
  <p>Pizzas, pastas, sandwiches, Indian and Chinese favourites and hot chai — all served with Hawa Mahal right in front of you.</p>
 </div>
</section>
<nav class="cat-nav" aria-label="Menu categories"><div class="wrap" id="catnav"></div></nav>
<div id="menu"></div>
<section class="book menu-cta">
 <div class="wrap book-in">
  <h2>Save your rooftop table</h2>
  <p>Sunset tables fill up first — message us on WhatsApp.</p>
  <a class="btn" style="background:#fff;color:var(--navy)" data-wa="Hi Jaipur Vista! I would like to book a table.">Book on WhatsApp <svg class="arrow"><use href="#i-arrow"/></svg></a>
 </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="data.js"></script>
<script>
// MENU — items aur prices yahan badlein: [naam, description, price, tags]
const MENU=[
 ["pizza","Pizzas","Crispy crust, real mozzarella — our guests’ favourite.","P:food-pizza",[
  ["Pesto Mexicano Pizza","Our signature — fresh pesto with a Mexican-style kick","",["Signature"]],
  ["Caprino Pizza","A guest favourite, loaded with cheese","",[]],
  ["Mushroom Pizza","Mushrooms, mozzarella and herbs","",[]],
  ["Loaded Veggie Pizza","Peppers, olives, onion, tomato and sweet corn","",[]]]],
 ["pasta","Pasta & sides","Creamy, comforting and made to share.","P:food-penne",[
  ["Pink Sauce Penne","Creamy tomato sauce with herbs and parmesan","",["Most ordered"]],
  ["Pasta with Cheesy Garlic Bread","Your pasta with a side of buttery, cheese-loaded garlic bread","",[]]]],
 ["sandwiches","Sandwiches","Toasted, golden and packed with flavour.","P:food-sandwich",[
  ["Pesto Mushroom Sandwich","Herby pesto mushrooms between toasted bread","",["Signature"]]]],
 ["indian-chinese","Indian & Chinese","Local favourites and a Chinese menu our regulars swear by.","P:food-dinner-view",[
  ["Chinese favourites","Ask our team for today’s Chinese picks","",["Guests love it"]],
  ["Indian classics","Home-style Indian dishes — ask for today’s menu","",[]]]],
 ["chai-coffee","Chai, coffee & cold drinks","Best enjoyed with Hawa Mahal in front of you.","U:1571934811356-5cc061b6821f",[
  ["Masala Chai","Hot, spiced and just right at sunset","",["Must try"]],
  ["Coffee","Hot or cold, made fresh","",[]],
  ["Cold drinks & shakes","Something chilled for warm Jaipur afternoons","",[]]]]];
document.getElementById('catnav').innerHTML=MENU.map(c=>`<a href="#${c[0]}">${c[1]}</a>`).join('');
document.getElementById('menu').innerHTML=MENU.map(c=>`<section class="menu-cat" id="${c[0]}"><div class="wrap menu-cat-head">
 <div class="img"><img src="${c[3].startsWith('P:')?P(c[3].slice(2)):U(c[3].slice(2),800)}" alt="" loading="lazy"></div>
 <div><h2>${c[1]}</h2><p class="intro">${c[2]}</p>
 ${c[4].map((i,k)=>`<div class="item"><div class="item-main"><h3>${i[0]}</h3><p>${i[1]}</p>${i[3].length?`<div class="tags">${i[3].map(t=>`<i>${t}</i>`).join('')}</div>`:''}</div>${i[2]?`<span class="price">${i[2]}</span>`:''}</div>`).join('')}
 </div></div></section>`).join('')+`<div class="wrap"><p class="menu-note">A few of our guests’ favourites. The full menu with prices (about ₹200–1,200 per person) is at the café — or WhatsApp us on ${CAFE.phone} and we’ll send it over.</p></div>`;
</script>
<script src="site.js"></script>
<script>
// highlight active category
const links=[...document.querySelectorAll('.cat-nav a')];
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));const a=links.find(a=>a.classList.contains('on'));a&&a.scrollIntoView({block:'nearest',inline:'center'})}}),{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('.menu-cat').forEach(s=>so.observe(s));
</script>
</body>
</html>
